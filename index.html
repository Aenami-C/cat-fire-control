<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="猫娘火控">

<meta name="theme-color" content="#dff4ff">

<title>🐱 猫娘火控</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        linear-gradient(180deg, #eaf8ff 0%, #f9fcff 55%, #edf8ff 100%);
    color: #28465c;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

.app {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 18px 14px 35px;
}

/* 标题 */

.header {
    text-align: center;
    padding: 8px 0 18px;
}

.cat {
    font-size: 48px;
    line-height: 1;
    filter: drop-shadow(0 5px 5px rgba(80,150,190,.18));
}

.title {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 800;
    color: #3988b7;
    letter-spacing: 1px;
}

.subtitle {
    margin-top: 5px;
    font-size: 12px;
    color: #89a9ba;
}

/* 卡片 */

.card {
    background: rgba(255,255,255,.88);
    border: 1px solid #d5edf8;
    border-radius: 22px;
    padding: 17px;
    margin-bottom: 14px;
    box-shadow:
        0 8px 25px rgba(70,145,180,.10);
}

.section-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    font-weight: 800;
    color: #3c7594;
    margin-bottom: 13px;
}

.section-title span {
    font-size: 20px;
}

/* 坐标选择 */

.coordinate {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.select-box {
    position: relative;
}

select {
    width: 100%;
    height: 48px;
    border: 1px solid #c7e5f2;
    border-radius: 13px;
    background: #f8fdff;
    color: #315a70;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    appearance: auto;
    outline: none;
}

.small-coordinate {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 8px;
}

.coord-label {
    font-size: 11px;
    color: #91aeba;
    text-align: center;
    margin-bottom: 4px;
}

/* 计算按钮 */

.calculate {
    width: 100%;
    height: 57px;
    border: none;
    border-radius: 17px;
    margin-top: 14px;

    background:
        linear-gradient(135deg,
            #6bc4ed,
            #55a9dc);

    color: white;
    font-size: 18px;
    font-weight: 800;

    box-shadow:
        0 7px 15px rgba(68,155,205,.22);
}

.calculate:active {
    transform: scale(.98);
}

/* 主结果 */

.result-card {
    background:
        linear-gradient(145deg,#ffffff,#f2fbff);
    border: 2px solid #ccecf8;
}

.result-main {
    text-align: center;
    padding: 4px 0 12px;
}

.result-label {
    font-size: 12px;
    color: #8aa9ba;
}

.bearing {
    margin-top: 3px;
    font-size: 46px;
    line-height: 1.05;
    font-weight: 900;
    color: #3489b9;
}

.distance {
    margin-top: 5px;
    font-size: 15px;
    color: #6f95a8;
}

/* 推荐结果 */

.recommend {
    margin-top: 13px;
    padding: 14px;
    border-radius: 16px;
    background: #eaf8ff;
    border: 1px solid #c9ebf8;
    text-align: center;
}

.recommend-title {
    font-size: 12px;
    color: #7fa8bb;
}

.recommend-value {
    margin-top: 4px;
    font-size: 28px;
    font-weight: 900;
    color: #3e96c5;
}

/* 表格 */

.table-title {
    font-size: 14px;
    font-weight: 800;
    color: #477b96;
    margin-bottom: 9px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 5px;
    font-size: 14px;
}

th {
    color: #98b2bf;
    font-size: 11px;
    font-weight: 500;
    padding: 5px;
}

td {
    padding: 10px 6px;
    text-align: center;
    background: #f4fbfe;
}

td:first-child {
    border-radius: 10px 0 0 10px;
}

td:last-child {
    border-radius: 0 10px 10px 0;
}

tr.recommended td {
    background: #dff5e9;
    color: #34845e;
    font-weight: 800;
}

tr.disabled {
    opacity: .35;
}

.badge {
    display: inline-block;
    margin-left: 4px;
    padding: 2px 5px;
    border-radius: 6px;
    background: #70c59a;
    color: white;
    font-size: 9px;
}

/* 复制 */

.copy-button {
    width: 100%;
    height: 45px;
    border: 1px solid #c9e7f3;
    border-radius: 13px;
    background: #f7fcff;
    color: #47819e;
    font-size: 14px;
    font-weight: 700;
    margin-top: 10px;
}

.copy-button:active {
    background: #e8f7fd;
}

/* 信息 */

.info {
    font-size: 12px;
    line-height: 1.8;
    color: #8aa4b2;
}

.formula {
    margin-top: 10px;
    padding: 9px;
    border-radius: 10px;
    background: #f3faff;
    color: #63899c;
    text-align: center;
}

/* 猫咪提示 */

.cat-tip {
    text-align: center;
    padding: 5px;
    color: #83a7b9;
    font-size: 12px;
}

.footer {
    text-align: center;
    color: #abc0ca;
    font-size: 10px;
    padding: 5px;
}

@media (prefers-color-scheme: dark) {

    body {
        background: #10202b;
        color: #dcecf4;
    }

    .card,
    .result-card {
        background: #172c38;
        border-color: #294655;
    }

    select,
    .copy-button {
        background: #12242e;
        color: #dcecf4;
        border-color: #345464;
    }

    .title,
    .bearing,
    .recommend-value {
        color: #79c9ed;
    }

    .subtitle,
    .result-label,
    .distance,
    .info,
    .cat-tip,
    .footer {
        color: #7897a6;
    }

    .recommend {
        background: #142f3b;
        border-color: #285365;
    }

    td {
        background: #142934;
    }

    tr.recommended td {
        background: #183c30;
    }

    .formula {
        background: #122832;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="cat">ฅ^•ﻌ•^ฅ</div>
        <div class="title">猫娘火控</div>
        <div class="subtitle">
            铁巢重炮 · 坐标射击计算器
        </div>
    </header>


    <!-- 我方坐标 -->

    <div class="card">

        <div class="section-title">
            <span>🏠</span>
            我方炮台
        </div>

        <div class="coordinate">

            <div>
                <div class="coord-label">横坐标</div>
                <select id="ourLetter"></select>
            </div>

            <div>
                <div class="coord-label">纵坐标</div>
                <select id="ourNumber"></select>
            </div>

        </div>

        <div class="small-coordinate">

            <div>
                <div class="coord-label">小坐标 X</div>
                <select id="ourSubX"></select>
            </div>

            <div>
                <div class="coord-label">小坐标 Y</div>
                <select id="ourSubY"></select>
            </div>

        </div>

    </div>


    <!-- 敌方坐标 -->

    <div class="card">

        <div class="section-title">
            <span>🎯</span>
            敌方目标
        </div>

        <div class="coordinate">

            <div>
                <div class="coord-label">横坐标</div>
                <select id="targetLetter"></select>
            </div>

            <div>
                <div class="coord-label">纵坐标</div>
                <select id="targetNumber"></select>
            </div>

        </div>

        <div class="small-coordinate">

            <div>
                <div class="coord-label">小坐标 X</div>
                <select id="targetSubX"></select>
            </div>

            <div>
                <div class="coord-label">小坐标 Y</div>
                <select id="targetSubY"></select>
            </div>

        </div>

        <button class="calculate" onclick="calculate()">
            🐾 喵！计算火控
        </button>

    </div>


    <!-- 主要结果 -->

    <div class="card result-card">

        <div class="result-main">

            <div class="result-label">
                方位角
            </div>

            <div class="bearing" id="bearing">
                --°
            </div>

            <div class="distance" id="distance">
                距离：-- km
            </div>

        </div>


        <div class="recommend">

            <div class="recommend-title">
                ⭐ 推荐射击方案
            </div>

            <div class="recommend-value"
                 id="recommend">
                -- 包 · --°
            </div>

        </div>


        <button class="copy-button"
                onclick="copyResult()">
            📋 复制射击参数
        </button>

    </div>


    <!-- 装药表 -->

    <div class="card">

        <div class="table-title">
            💙 全部装药方案
        </div>

        <table>

            <thead>
                <tr>
                    <th>装药</th>
                    <th>最大射程</th>
                    <th>仰角</th>
                    <th>状态</th>
                </tr>
            </thead>

            <tbody id="ammoTable">
            </tbody>

        </table>

    </div>


    <!-- 规则 -->

    <div class="card">

        <div class="section-title">
            <span>🐾</span>
            计算规则
        </div>

        <div class="info">

            每个大方格 = 1 km<br>
            每个小坐标 = 0.1 km<br><br>

            方位角：<br>
            ↑ 0°　→ 90°　↓ 180°　← 270°

            <div class="formula">
                距离 = √(ΔX² + ΔY²)<br>
                仰角 = 12 × 距离 ÷ 装药量
            </div>

        </div>

    </div>


    <div class="cat-tip">
        今天也要精准地把炮弹送到目标旁边喵 ฅ(=^･ω･^=)ฅ
    </div>

    <div class="footer">
        猫娘火控 · iPhone Web App
    </div>

</div>


<script>

/* ================================
   初始化选择框
================================ */

function fillSelect(id, values) {

    const select =
        document.getElementById(id);

    select.innerHTML = "";

    values.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        select.appendChild(option);

    });
}


/* A～T */

const letters =
    Array.from(
        {length:20},
        (_,i) =>
            String.fromCharCode(65+i)
    );


/* 1～10 */

const numbers =
    Array.from(
        {length:10},
        (_,i) => i+1
    );


/* 0～9 */

const small =
    Array.from(
        {length:10},
        (_,i) => i
    );


fillSelect("ourLetter", letters);
fillSelect("targetLetter", letters);

fillSelect("ourNumber", numbers);
fillSelect("targetNumber", numbers);

fillSelect("ourSubX", small);
fillSelect("ourSubY", small);

fillSelect("targetSubX", small);
fillSelect("targetSubY", small);


/* ================================
   默认值
================================ */

document.getElementById("ourLetter").value = "E";
document.getElementById("ourNumber").value = "4";

document.getElementById("targetLetter").value = "F";
document.getElementById("targetNumber").value = "5";

document.getElementById("ourSubX").value = "0";
document.getElementById("ourSubY").value = "0";

document.getElementById("targetSubX").value = "0";
document.getElementById("targetSubY").value = "9";


/* ================================
   读取坐标
================================ */

function getCoordinate(prefix) {

    const letter =
        document.getElementById(
            prefix + "Letter"
        ).value;

    const number =
        Number(
            document.getElementById(
                prefix + "Number"
            ).value
        );

    const subX =
        Number(
            document.getElementById(
                prefix + "SubX"
            ).value
        );

    const subY =
        Number(
            document.getElementById(
                prefix + "SubY"
            ).value
        );


    const column =
        letter.charCodeAt(0) - 65;


    return {

        x: column + subX / 10,

        y: number + subY / 10,

        text:
            `${letter}${number}(${subX}:${subY})`

    };

}


/* ================================
   计算
================================ */

let latestResult = null;


function calculate() {

    const our =
        getCoordinate("our");

    const target =
        getCoordinate("target");


    const dx =
        target.x - our.x;

    const dy =
        target.y - our.y;


    /* 距离 */

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /* 方位角
       上 = 0
       右 = 90
       下 = 180
       左 = 270
    */

    let bearing =
        Math.atan2(dx, dy)
        * 180 / Math.PI;


    if (bearing < 0)
        bearing += 360;


    /* 推荐最低装药 */

    let recommendedAmmo =
        Math.ceil(distance / 5);


    recommendedAmmo =
        Math.max(
            1,
            Math.min(
                6,
                recommendedAmmo
            )
        );


    const recommendedPitch =
        12 *
        distance /
        recommendedAmmo;


    latestResult = {

        our,
        target,
        distance,
        bearing,
        recommendedAmmo,
        recommendedPitch

    };


    /* 显示结果 */

    document.getElementById(
        "bearing"
    ).textContent =
        bearing.toFixed(2) + "°";


    document.getElementById(
        "distance"
    ).textContent =
        "距离：" +
        distance.toFixed(3) +
        " km";


    document.getElementById(
        "recommend"
    ).textContent =
        recommendedAmmo +
        " 包 · " +
        recommendedPitch.toFixed(2) +
        "°";


    /* 装药表 */

    const table =
        document.getElementById(
            "ammoTable"
        );

    table.innerHTML = "";


    for (
        let ammo = 1;
        ammo <= 6;
        ammo++
    ) {

        const maxRange =
            ammo * 5;

        const available =
            distance <= maxRange;

        const pitch =
            available
            ? 12 * distance / ammo
            : null;


        const tr =
            document.createElement("tr");


        if (
            ammo === recommendedAmmo &&
            available
        ) {
            tr.classList.add(
                "recommended"
            );
        }


        if (!available) {
            tr.classList.add(
                "disabled"
            );
        }


        tr.innerHTML = `

            <td>
                ${ammo} 包
                ${
                    ammo === recommendedAmmo &&
                    available
                    ? '<span class="badge">推荐</span>'
                    : ''
                }
            </td>

            <td>
                ${maxRange} km
            </td>

            <td>
                ${
                    available
                    ? pitch.toFixed(2) + "°"
                    : "--"
                }
            </td>

            <td>
                ${
                    available
                    ? "可用"
                    : "超射程"
                }
            </td>
        `;


        table.appendChild(tr);

    }


    /* 保存炮台位置 */

    localStorage.setItem(
        "catFireControlOur",
        JSON.stringify(our)
    );

}


/* ================================
   复制结果
================================ */

function copyResult() {

    if (!latestResult) {

        calculate();

    }


    const r =
        latestResult;


    const text =

`🐱 铁巢重炮火控

我方：${r.our.text}
目标：${r.target.text}

方位角：${r.bearing.toFixed(2)}°
距离：${r.distance.toFixed(3)} km

推荐：
${r.recommendedAmmo} 包
仰角：${r.recommendedPitch.toFixed(2)}°`;


    if (
        navigator.clipboard
    ) {

        navigator.clipboard.writeText(
            text
        ).then(() => {

            alert(
                "已复制喵 ฅ^•ﻌ•^ฅ"
            );

        });

    } else {

        alert(text);

    }

}


/* ================================
   恢复炮台坐标
================================ */

try {

    const saved =
        JSON.parse(
            localStorage.getItem(
                "catFireControlOur"
            )
        );


    if (saved) {

        document.getElementById(
            "ourLetter"
        ).value =
            saved.text[0];

        const match =
            saved.text.match(
                /^[A-T](\d+)/
            );

        if (match) {

            document.getElementById(
                "ourNumber"
            ).value =
                match[1];

        }

    }

} catch(e) {}


/* ================================
   初始计算
================================ */

calculate();

</script>

</body>
</html>
